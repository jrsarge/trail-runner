<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trail Hop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #e7f3f7;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        color: #fff;
      }

      .hud-stats {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
        line-height: 1.5;
      }

      .hud-row {
        display: flex;
        gap: 10px;
        white-space: nowrap;
      }

      .hud-label {
        opacity: 0.7;
        width: 3.4em;
        font-size: 0.8em;
        letter-spacing: 0.04em;
        align-self: center;
      }

      .hud-value {
        font-size: 1.1em;
        font-variant-numeric: tabular-nums;
      }

      /* Stamina meter (ticket 15 §2b) -- the only UI element in the game. A single thin
         bar, directly under the stat block, no numbers/percentage/segments. Width is set
         directly from JS every frame with no CSS transition: stamina only ever decreases,
         and a transitioned width could visually read as refilling on a restart snap-back
         (DESIGN.md "The core loop" -- "backing off does not recover it"). */
      .hud-stamina {
        position: relative;
        margin-top: 8px;
        width: 100%;
        height: 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .hud-stamina-fill {
        height: 100%;
        display: flex;
        justify-content: flex-end; /* pushes the burn band to the depleting (right) edge */
        background: rgba(255, 255, 255, 0.85);
      }

      .hud-stamina-fill.warning {
        background: #ff9a52;
      }

      /* The burn zone: brighter band at the depleting edge, sized to the stamina that
         would drain over the next HUD.BURN_LOOKAHEAD seconds at the current rate, eased so
         it reads as a band rather than jitter. This is the only feedback that effort costs
         anything once the wobble telegraph is gone -- see DESIGN.md "Telegraphing". */
      .hud-stamina-burn {
        height: 100%;
        background: #ffe066;
        box-shadow: 0 0 6px rgba(255, 224, 102, 0.8);
      }

      .hud-tutorial {
        position: absolute;
        left: 50%;
        top: 10%;
        transform: translateX(-50%);
        padding: 6px 16px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        font-size: 1em;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .hud-tutorial.visible {
        opacity: 1;
      }

      .hud-ready {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        padding: 8px 18px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        font-size: 1.1em;
        text-align: center;
        white-space: nowrap;
      }

      .hud-countdown {
        display: none;
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        font-size: 5.5em;
        font-weight: 700;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        transition: opacity 0.1s linear;
      }

      .hud-finish {
        display: none;
        pointer-events: auto;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 28px 40px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        text-align: center;
        cursor: pointer;
      }

      .hud-finish-title {
        font-size: 1.3em;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .hud-finish-time {
        font-size: 3em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .hud-finish-newbest {
        display: none;
        font-size: 0.95em;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffe066;
      }

      .hud-finish-delta {
        display: none;
        font-size: 1.2em;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
      }

      .hud-finish-delta.good {
        color: #6bffa0;
      }

      .hud-finish-delta.bad {
        color: #ff8a7a;
      }

      .hud-finish-stats {
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }

      .hud-finish-prompt {
        margin-top: 8px;
        opacity: 0.7;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
