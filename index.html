<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trail Hop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #e7f3f7;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        color: #fff;
      }

      .hud-stats {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
        line-height: 1.5;
      }

      .hud-row {
        display: flex;
        gap: 10px;
        white-space: nowrap;
      }

      .hud-label {
        opacity: 0.7;
        width: 3.4em;
        font-size: 0.8em;
        letter-spacing: 0.04em;
        align-self: center;
      }

      .hud-value {
        font-size: 1.1em;
        font-variant-numeric: tabular-nums;
      }

      /* Stamina meter (ticket 15 §2b, replaced ticket 16 §3b) -- the only UI element in the
         game. A single thin bar, directly under the stat block, no numbers/percentage/
         segments. Width is set directly from JS every frame with no CSS transition:
         stamina only ever decreases, and a transitioned width could visually read as
         refilling on a restart snap-back (DESIGN.md "The core loop" -- "backing off does
         not recover it").

         Ticket 16 §3b (superseding an earlier "recolour the burn band" attempt, then
         superseding the burn band itself): playtested, the burn band plus an orange
         warning fill was two competing signals on a 7px strip. Replaced with a plain
         three-colour tank-level readout -- green/yellow/red, driven by HUD.STAMINA_YELLOW
         / HUD.STAMINA_RED, hard-switched (no gradient/transition) so the colour never lies
         about a mid-state. Level and colour are now the ONLY cost feedback (wobble is also
         gone, §3a) -- see the ticket 16 report for whether that proved sufficient. */
      .hud-stamina-label {
        opacity: 0.7;
        font-size: 0.8em;
        letter-spacing: 0.04em;
        margin-top: 8px;
      }

      .hud-stamina {
        position: relative;
        margin-top: 4px;
        width: 100%;
        height: 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .hud-stamina-fill {
        height: 100%;
        background: #5ee87a; /* tier-green: above HUD.STAMINA_YELLOW */
      }

      .hud-stamina-fill.tier-yellow {
        background: #ffd23f; /* HUD.STAMINA_RED < fraction <= HUD.STAMINA_YELLOW */
      }

      .hud-stamina-fill.tier-red {
        background: #ff4d4d; /* fraction <= HUD.STAMINA_RED */
      }

      .hud-tutorial {
        position: absolute;
        left: 50%;
        top: 10%;
        transform: translateX(-50%);
        padding: 6px 16px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        font-size: 1em;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .hud-tutorial.visible {
        opacity: 1;
      }

      .hud-ready {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        padding: 8px 18px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        font-size: 1.1em;
        text-align: center;
        white-space: nowrap;
      }

      .hud-countdown {
        display: none;
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        font-size: 5.5em;
        font-weight: 700;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        transition: opacity 0.1s linear;
      }

      .hud-finish {
        display: none;
        pointer-events: auto;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 28px 40px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        text-align: center;
        cursor: pointer;
      }

      .hud-finish-title {
        font-size: 1.3em;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .hud-finish-time {
        font-size: 3em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .hud-finish-newbest {
        display: none;
        font-size: 0.95em;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffe066;
      }

      .hud-finish-delta {
        display: none;
        font-size: 1.2em;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
      }

      .hud-finish-delta.good {
        color: #6bffa0;
      }

      .hud-finish-delta.bad {
        color: #ff8a7a;
      }

      .hud-finish-stats {
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }

      .hud-finish-prompt {
        margin-top: 8px;
        opacity: 0.7;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
